<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Görsel Oluşturucu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');

        :root {
            --primary-glow: #00f2fe;
            --secondary-glow: #4facfe;
            --accent: #7000ff;
            --glass-bg: rgba(20, 20, 35, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(255, 255, 255, 0.05);
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #050510;
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Hareketli Arka Plan (Aurora Efekti) */
        .ambient-light {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at 15% 50%, rgba(76, 29, 149, 0.2), transparent 40%),
                        radial-gradient(circle at 85% 30%, rgba(0, 242, 254, 0.15), transparent 40%);
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            animation: floatOrb 20s infinite ease-in-out;
        }

        .orb-1 { width: 400px; height: 400px; background: rgba(112, 0, 255, 0.3); top: -100px; left: -100px; }
        .orb-2 { width: 300px; height: 300px; background: rgba(0, 242, 254, 0.2); bottom: -50px; right: -50px; animation-delay: -5s; }
        .orb-3 { width: 200px; height: 200px; background: rgba(255, 0, 128, 0.2); top: 40%; left: 60%; animation-delay: -10s; }

        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 50px); }
        }

        /* Ana Container & Glassmorphism */
        .main-container {
            padding: 40px 20px;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 50px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        /* Parlayan Üst Çizgi */
        .glass-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
        }

        /* Başlıklar */
        h1 {
            font-weight: 700;
            font-size: 3rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #fff, #b4b4b4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }

        /* Toggle Butonları */
        .mode-toggle {
            background: rgba(0,0,0,0.3);
            padding: 5px;
            border-radius: 50px;
            display: inline-flex;
            margin-bottom: 2rem;
            border: 1px solid var(--glass-border);
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 10px 30px;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, var(--accent), #4facfe);
            color: white;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
        }

        /* Form Elemanları */
        .form-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 8px;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .form-control, .form-select {
            background-color: var(--input-bg);
            border: 1px solid var(--glass-border);
            color: white;
            border-radius: 12px;
            padding: 16px;
            transition: all 0.3s ease;
        }

        .form-control:focus, .form-select:focus {
            background-color: rgba(255,255,255,0.1);
            border-color: var(--secondary-glow);
            box-shadow: 0 0 0 4px rgba(79, 172, 254, 0.1);
            color: white;
        }
        
        /* Select içindeki option'lar için arka plan (Chrome/Firefox fix) */
        option {
            background-color: #1a1a2e;
            color: white;
        }

        .form-control::placeholder {
            color: rgba(255,255,255,0.3);
        }

        /* Örnek Chip'ler */
        .example-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .example-chip {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .example-chip:hover {
            background: rgba(255,255,255,0.1);
            border-color: var(--secondary-glow);
            color: white;
            transform: translateY(-2px);
        }

        .example-chip i { margin-right: 5px; color: var(--secondary-glow); }

        /* Oluştur Butonu */
        .generate-btn {
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            color: white;
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 16px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            margin-top: 20px;
            box-shadow: 0 10px 30px rgba(0, 114, 255, 0.3);
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(0, 114, 255, 0.5);
            filter: brightness(1.1);
        }

        .generate-btn:disabled {
            background: #333;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Yükleme Ekranı */
        .loading-section {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loading-bar {
            width: 200px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin: 20px auto;
            position: relative;
            overflow: hidden;
        }

        .loading-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 50%;
            background: linear-gradient(90deg, transparent, #00f2fe, transparent);
            animation: loadingSwipe 1.5s infinite;
        }

        @keyframes loadingSwipe {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(200%); }
        }

        /* Sonuç Alanı */
        .result-section {
            display: none;
            margin-top: 40px;
            animation: fadeIn 0.8s ease;
        }

        .image-container {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid var(--glass-border);
        }

        .result-image {
            width: 100%;
            display: block;
            transition: transform 0.5s ease;
        }

        .result-image:hover {
            transform: scale(1.02);
        }

        /* Aksiyon Butonları */
        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
        }

        .action-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 500;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }

        .action-btn.primary {
            background: var(--text-primary);
            color: black;
        }
        
        .action-btn.primary:hover {
            background: #e0e0e0;
        }

        /* Input Group Button override */
        .input-group .btn-outline-secondary {
            border-color: var(--glass-border);
            color: var(--text-secondary);
        }
        .input-group .btn-outline-secondary:hover {
            background-color: rgba(255,255,255,0.1);
            color: white;
        }

        /* Gelişmiş Bölüm */
        .advanced-section {
            background: rgba(0,0,0,0.2);
            border-radius: 20px;
            padding: 25px;
            margin-top: 25px;
            border: 1px dashed rgba(255,255,255,0.1);
            display: none;
        }
        
        .advanced-section.show {
            display: block;
            animation: slideDown 0.4s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @media (max-width: 768px) {
            .glass-card { padding: 30px 20px; }
            h1 { font-size: 2rem; }
            .mode-btn { padding: 8px 20px; font-size: 0.9rem; }
            .action-buttons { flex-direction: column; }
            .action-btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- Arka Plan Efektleri -->
    <div class="ambient-light">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="container main-container">
        <div class="row justify-content-center">
            <div class="col-lg-10 col-xl-9">
                
                <!-- Ana Kart -->
                <div class="glass-card" data-aos="fade-up">
                    
                    <div class="text-center mb-5">
                        <div class="d-inline-block mb-2">
                            <span style="color: var(--secondary-glow); font-size: 0.9rem; letter-spacing: 2px; text-transform: uppercase;">Yapay Zeka Destekli</span>
                        </div>
                        <h1>Hayallerini Görsele Çevir</h1>
                        <p class="subtitle">Sadece bir metin girin, gerisini AI halletsin.</p>
                        
                        <div class="mode-toggle">
                            <button class="mode-btn active" onclick="setMode('simple')">
                                <i class="bi bi-stars"></i> Basit Mod
                            </button>
                            <button class="mode-btn" onclick="setMode('advanced')">
                                <i class="bi bi-sliders2"></i> Pro Mod
                            </button>
                        </div>

                        <div class="example-chips">
                            <button class="example-chip" onclick="setPrompt('Cyberpunk city street at night, neon lights, rain reflection, highly detailed, 8k')">
                                <i class="bi bi-building"></i> Cyberpunk Şehir
                            </button>
                            <button class="example-chip" onclick="setPrompt('A cute fluffy astronaut cat in space, digital art, vibrant colors')">
                                <i class="bi bi-github"></i> Astronot Kedi
                            </button>
                            <button class="example-chip" onclick="setPrompt('Mystical forest with glowing mushrooms, fantasy art style, dreamy atmosphere')">
                                <i class="bi bi-tree"></i> Büyülü Orman
                            </button>
                            <button class="example-chip" onclick="setPrompt('Portrait of a futuristic robot, sleek white metal, blue glowing eyes, studio lighting')">
                                <i class="bi bi-robot"></i> Fütüristik Robot
                            </button>
                        </div>
                    </div>

                    <div class="row g-4">
                        <div class="col-12">
                            <label class="form-label">Görsel Açıklaması (Prompt)</label>
                            <textarea class="form-control" id="prompt" rows="3" placeholder="Örn: Gün batımında deniz kenarında koşan bir at, yağlı boya stili..."></textarea>
                        </div>
                    </div>

                    <!-- Gelişmiş Ayarlar Bölümü -->
                    <div class="advanced-section" id="advancedSection">
                        <div class="row g-4">
                            <div class="col-12 border-bottom border-secondary pb-2 mb-2">
                                <h6 class="text-white m-0"><i class="bi bi-tools"></i> Detaylı Ayarlar</h6>
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label">Model</label>
                                <select class="form-select" id="model">
                                    <option value="turbo" selected>Turbo (En Hızlı)</option>
                                    <option value="flux">Flux (Gerçekçi)</option>
                                    <option value="midjourney">Midjourney Style</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Seed (Rastgelelik Kodu)</label>
                                <div class="input-group">
                                    <input type="number" class="form-control" id="seed" placeholder="Rastgele için boş bırak">
                                    <button class="btn btn-outline-secondary" type="button" onclick="randomSeed()">
                                        <i class="bi bi-shuffle"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Sanat Stili</label>
                                <select class="form-select" id="style">
                                    <option value="">Stil Yok (Doğal)</option>
                                    <option value="cinematic">Sinematik</option>
                                    <option value="anime">Anime / Manga</option>
                                    <option value="3d-model">3D Render</option>
                                    <option value="oil-painting">Yağlı Boya</option>
                                    <option value="sketch">Karakalem</option>
                                    <option value="polaroid">Polaroid Fotoğraf</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Detay Artırma (Upscale)</label>
                                <select class="form-select" id="enhance">
                                    <option value="false">Kapalı (Hızlı)</option>
                                    <option value="true">Açık (Daha Keskin)</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Negatif Prompt (İstemediğin Şeyler)</label>
                                <input type="text" class="form-control" id="negative" placeholder="Örn: bulanık, kötü çizim, bozuk eller, metin...">
                            </div>
                        </div>
                    </div>

                    <button class="generate-btn" onclick="generateImage()">
                        <i class="bi bi-magic me-2"></i> Oluştur
                    </button>

                    <!-- Yükleme Animasyonu -->
                    <div class="loading-section" id="loadingSection">
                        <div class="loading-bar"></div>
                        <h5 class="mt-3 fw-light" style="color: var(--secondary-glow)">Yapay Zeka Sanatını İşliyor...</h5>
                        <small class="text-muted">Bu işlem birkaç saniye sürebilir.</small>
                    </div>

                    <!-- Sonuç Alanı -->
                    <div class="result-section" id="resultSection">
                        <div class="image-container">
                            <img id="generatedImage" class="result-image" alt="AI Generated Art">
                        </div>
                        <div class="action-buttons">
                            <button class="action-btn primary" onclick="downloadImage()">
                                <i class="bi bi-download"></i> İndir (HD)
                            </button>
                            <button class="action-btn" onclick="newImage()">
                                <i class="bi bi-arrow-counterclockwise"></i> Yeniden Oluştur
                            </button>
                        </div>
                    </div>

                </div>
                
                <p class="text-center mt-4 text-muted" style="font-size: 0.8rem;">
                    Pollinations.ai API altyapısı kullanılmaktadır.
                </p>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        // Animasyonları Başlat
        AOS.init({
            duration: 1000,
            once: true
        });

        let currentImageUrl = '';
        let currentMode = 'simple';

        // Mod Değiştirme (Basit / Pro)
        function setMode(mode) {
            currentMode = mode;
            
            // Buton aktiflik durumu
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            // Gelişmiş paneli aç/kapa
            const advancedSection = document.getElementById('advancedSection');
            if (mode === 'advanced') {
                advancedSection.classList.add('show');
            } else {
                advancedSection.classList.remove('show');
            }
        }

        // Prompt'u inputa yaz
        function setPrompt(text) {
            const promptInput = document.getElementById('prompt');
            promptInput.value = text;
            promptInput.focus();
            // Hafif bir highlight efekti verelim
            promptInput.style.borderColor = 'var(--primary-glow)';
            setTimeout(() => {
                promptInput.style.borderColor = 'var(--glass-border)';
            }, 500);
        }

        // Rastgele Seed oluştur
        function randomSeed() {
            const randomVal = Math.floor(Math.random() * 999999999);
            document.getElementById('seed').value = randomVal;
        }

        // Çeviri Fonksiyonu (Türkçe -> İngilizce)
        async function translateToEnglish(text) {
            const hasTurkishChars = /[çğıöşüÇĞİÖŞÜ]/.test(text);
            if (!hasTurkishChars) return text; // Türkçe karakter yoksa direkt döndür

            try {
                // MyMemory ücretsiz çeviri API
                const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=tr|en`);
                const data = await response.json();
                
                if (data.responseStatus === 200 && data.responseData.translatedText) {
                    return data.responseData.translatedText;
                }
                return text;
            } catch (error) {
                console.warn('Çeviri servisi yanıt vermedi, orijinal metin kullanılıyor.');
                return text;
            }
        }

        // Görsel Oluşturma Ana Fonksiyonu
        async function generateImage() {
            const promptInput = document.getElementById('prompt');
            const prompt = promptInput.value.trim();
            // Sabit boyut (1024x1024 - HD)
            const width = 1024;
            const height = 1024;
            const btn = document.querySelector('.generate-btn');

            if (!prompt) {
                promptInput.style.borderColor = 'red';
                setTimeout(() => promptInput.style.borderColor = 'var(--glass-border)', 1000);
                return;
            }

            // UI Durumunu Güncelle
            document.getElementById('loadingSection').style.display = 'block';
            document.getElementById('resultSection').style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Oluşturuluyor...';

            try {
                // 1. Türkçe ise Çevir
                let finalPrompt = await translateToEnglish(prompt);
                
                // 2. Gelişmiş Ayarları Ekle
                if (currentMode === 'advanced') {
                    const style = document.getElementById('style').value;
                    const negative = document.getElementById('negative').value;
                    const model = document.getElementById('model').value;
                    const enhance = document.getElementById('enhance').value;

                    if (style) finalPrompt += `, ${style} style`;
                    if (enhance === 'true') finalPrompt += `, highly detailed, 8k resolution, sharp focus`;
                    if (negative) {
                        const translatedNegative = await translateToEnglish(negative);
                        finalPrompt += ` | negative prompt: ${translatedNegative}`;
                    }
                    // Model parametresi URL'e eklenebilir ama şu an basit tutuyoruz, prompt içine stil olarak yansıtıyoruz
                }

                // 3. Seed Ayarla
                let seed = document.getElementById('seed').value;
                if (!seed) seed = Math.floor(Math.random() * 1000000);

                // 4. URL Oluştur
                const encodedPrompt = encodeURIComponent(finalPrompt);
                currentImageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=${width}&height=${height}&nologo=true&seed=${seed}`;

                // 5. Görseli Yükle
                const img = document.getElementById('generatedImage');
                
                // Yeni bir Image objesi ile önden yükleme yapıp sonra DOM'a basacağız
                const loaderImg = new Image();
                
                loaderImg.onload = function() {
                    img.src = currentImageUrl;
                    document.getElementById('loadingSection').style.display = 'none';
                    document.getElementById('resultSection').style.display = 'block';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-magic me-2"></i> Oluştur';
                    
                    // Sonuca kaydır
                    document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth', block: 'center' });
                };

                loaderImg.onerror = function() {
                    alert('Görsel sunucudan alınamadı. Lütfen tekrar deneyin.');
                    resetUI();
                };

                loaderImg.src = currentImageUrl;

            } catch (error) {
                console.error(error);
                alert('Beklenmedik bir hata oluştu.');
                resetUI();
            }

            function resetUI() {
                document.getElementById('loadingSection').style.display = 'none';
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-magic me-2"></i> Oluştur';
            }
        }

        // İndirme Fonksiyonu
        async function downloadImage() {
            try {
                const response = await fetch(currentImageUrl);
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `AI-Art-${Date.now()}.png`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
            } catch (error) {
                alert('İndirme başlatılamadı. Tarayıcı izinlerini kontrol edin.');
            }
        }

        // Yeni Görsel İçin Reset
        function newImage() {
            document.getElementById('prompt').value = '';
            document.getElementById('resultSection').style.display = 'none';
            document.getElementById('prompt').focus();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Ctrl + Enter Kısayolu
        document.getElementById('prompt').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                generateImage();
            }
        });
    </script>
</body>
</html>
